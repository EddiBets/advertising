{% extends "base.html" %}

{% block page_title %}Разместить объявление{% endblock page_title %}

{% block page_content %}
    <h1>Подать новое объявление</h1>

    <form method="POST">
        {% csrf_token %}

        <div>
            <label for="titleInput"> Заголовок объявления: </label>
            <input id="titleInput" name="title" type="text" placehplder="заголовок (максимальная длина 200 символов)" required>
        </div>

        <div>
            <label for="textInput"> Текст поста: </label>
            <textarea id="textInput" name="text" rows="3"></textarea>
        </div>

        <button type="submit">Создать</button>
    </form>

{% endblock page_content %}
